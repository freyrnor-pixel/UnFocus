name: AAB signing certificate (fingerprints + PEM)

# Answers "which key signed this .aab?" without a keystore or an Expo login: the signer's
# certificate is inside every bundle (META-INF/*.RSA). Prints SHA1/SHA256 for each URL and uploads
# the certificate as `upload_certificate.pem` — the exact file Play Console's "Request upload key
# reset" asks for (Test and release → App integrity → App signing).
#
# Added 2026-10-16 after Play rejected the com.unfocus.freyr AAB: the listing already had an
# upload key registered (SHA1 89:1E:BE:…) and EAS generated a new one for the new package.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated .aab URLs (expo.dev/artifacts/…). The FIRST one's cert becomes upload_certificate.pem.
        required: true
        type: string

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read signing certificates
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          i=0
          for url in $URLS; do
            i=$((i+1))
            mkdir -p "b$i"
            curl -sfL -o "b$i/app.aab" "$url"
            echo "downloaded: $(stat -c %s "b$i/app.aab") bytes, $(file -b "b$i/app.aab")"
            unzip -l "b$i/app.aab" | grep -i 'META-INF' || true
            # keytool reads the jar signature wherever it lives — no guessing the .RSA name.
            {
              echo "### $url"
              echo '```'
              keytool -printcert -jarfile "b$i/app.aab" | grep -E 'Owner|SHA1|SHA256' || echo "no signature found"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            keytool -printcert -rfc -jarfile "b$i/app.aab" | sed -n '/BEGIN CERT/,/END CERT/p' > "b$i/cert.pem"
          done
          cp b1/cert.pem upload_certificate.pem
          test -s upload_certificate.pem

      - name: Upload upload_certificate.pem
        uses: actions/upload-artifact@v4
        with:
          name: upload_certificate
          path: upload_certificate.pem
