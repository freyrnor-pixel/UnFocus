name: CI

# Quality gate for pull requests into main. Real users are on `main` (a merge
# publishes an OTA update on next launch), so typecheck + lint + tests must pass
# before a PR can merge. This is the only workflow that runs on pull_request —
# the others (update/build) run on push to main or manual dispatch.

on:
  pull_request:
    branches:
      - main

# Read-only: this workflow only inspects the code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    # ⚠️ **A job with no timeout inherits GitHub's default of 360 minutes.** Every build
    # workflow in this repo already sets one (45-60); the two CI jobs were the exceptions, and
    # this is the only workflow that runs on every push to a PR — so a hang here is also the one
    # that blocks the `concurrency` group and makes the NEXT push look stuck behind it.
    # Typecheck + lint + test is ~90s; 15 gives an order of magnitude of headroom and still
    # fails within a coffee break rather than half a working day.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

  # ---------------------------------------------------------------------------
  # The VISUAL gate.
  #
  # Until 2026-08-29 every visual harness in this repo ran only when somebody remembered to run
  # it, which in practice meant the maintainer's eyes were the first detector of every visual
  # regression — and a defect fixed once could come back with nothing to notice. Worse, two of
  # the audits fail by UN-MEASURING (a stale locator makes a step skip while the run still
  # prints a confident total), so "nobody ran it" and "it ran and saw half the app" looked the
  # same. Both are now gates, and both are here.
  #
  # Separate job, not more steps on `verify`: it builds a web bundle and drives Chromium, so it
  # is minutes rather than seconds, and a red pixel diff should be legible as its own thing
  # rather than buried under a typecheck.
  # ---------------------------------------------------------------------------
  visual:
    name: Visual, geometry & layout audits
    runs-on: ubuntu-latest
    # This job builds a web bundle and drives Chromium through four audits in both themes, so it
    # is minutes rather than seconds: measured 15-17 minutes across every run on 2026-09-06.
    # 35 is roughly double the observed worst case — high enough that a slow runner is not a
    # false failure, low enough that a genuinely wedged Playwright step is killed while someone
    # is still looking at the PR.
    #   ⚠️ Raise this only with a measurement. If runs start timing out, the question is what got
    # slower — a walk that has begun waiting out a stale locator's full timeout on every step is
    # exactly the failure this repo keeps finding, and it presents as "CI got slower", not as an
    # error. See EXECUTION_RULES.md's standing debt.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Chromium is pre-installed on this image via Playwright's own download step. The repo
      # never runs `playwright install` locally (the remote env pins PLAYWRIGHT_BROWSERS_PATH),
      # but CI has no such pre-seeded browser, so it is fetched here.
      #
      # ⚠️ **Retried 3x (2026-09-09) — this step failed the whole visual job twice in a row on
      # a #688 that touched nothing but a JSON version number, so the failure was in the step,
      # not the change.** `--with-deps` runs `apt-get update` against every configured source,
      # including the Google Chrome repo the runner image ships pre-added — even though we ask
      # only for `chromium`, not `google-chrome`. Both runs failed identically:
      # `E: Failed to fetch .../dl.google.com/.../Packages.gz  Hash Sum mismatch` — a transient
      # state on Google's own mirror, external to this repo, not something a third re-run of
      # the JOB would reliably dodge since GitHub Actions caches nothing here to fall back to.
      # A short retry loop around the STEP itself is the fix: cheap, and it turns a one-off
      # mirror hiccup back into what it actually is — noise — instead of a red PR.
      - name: Install Chromium
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $i/3), retrying in 10s…"
            sleep 10
          done
          exit 1

      # Build ONCE and reuse it for all four audits — each of the run-*.sh wrappers reuses an
      # existing dist/ and only builds when it is missing.
      - name: Build web preview
        run: npm run preview:build

      # Every gate runs even if an earlier one fails: they answer different questions, and
      # seeing only the first failure is what turns a multi-audit run into a one-audit run.
      # Both themes. Dark is the DEFAULT appearance, and every glass, edge and glow decision in
      # this app is tuned for it — a light-only gate would guard the mode fewer people see, and
      # the 2026-08-29 backdrop change fired ONLY in dark.
      #
      # ⚠️ **This ran for one day with `npm run visual` REMOVED, and the reason it is back is a
      # dependency pin, not a tolerance.** The gate failed here with all 21 baselines "changed"
      # by a uniform 0.1-1.05% — because `@playwright/test` was on a caret and had drifted to a
      # version whose launch defaults render text differently from the one that blessed them.
      # Pinned to `~1.56.0` (the version matching the dev environment's pre-installed browser),
      # both sides render identically. `lib/__tests__/visualGate.test.ts` keeps the range on `~`.
      #   Do NOT re-fix a red visual run by raising MAX_DIFF_RATIO past the noise floor — that is
      # precisely where a single-card regression hides. See DECISIONS_OPEN.md.
      - name: Visual regression (light)
        if: always()
        run: npm run visual

      - name: Visual regression (dark)
        if: always()
        run: npm run visual -- --theme=dark

      # ⚠️ Each of these ran LIGHT-MODE ONLY until 2026-09-01, even though dark is the app's
      # DEFAULT appearance and every glass/edge/glow decision is tuned for it — only `visual`
      # was checked in both themes. A dark-only regression (like the 2026-08-29 backdrop change)
      # was invisible to three of the four visual gates by construction. See AGENTS.md.
      - name: Geometry (light)
        if: always()
        run: npm run geometry

      - name: Geometry (dark)
        if: always()
        run: npm run geometry -- --theme=dark

      - name: Wrap audit (Norwegian, 360px, light)
        if: always()
        run: npm run wraps -- --lang=no --width=360

      - name: Wrap audit (Norwegian, 360px, dark)
        if: always()
        run: npm run wraps -- --lang=no --width=360 --theme=dark

      - name: Halo audit (light)
        if: always()
        run: npm run halos

      - name: Halo audit (dark)
        if: always()
        run: npm run halos -- --theme=dark

      # The diffs are the whole point of a red visual run — without them the failure says a
      # number and nothing else.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: visual-diff-out/
          if-no-files-found: ignore
          retention-days: 14
