<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The harness's own fontconfig (2026-10-11), loaded via FONTCONFIG_FILE by
     scripts/chromium-path.mjs. It takes the machine's configuration and then ASSIGNS one text
     rasterisation on top, so a screenshot no longer depends on which machine took it: a stock
     Ubuntu runner hints "slight" with sub-pixel RGB; the cloud dev image unhints to grayscale.
     Before this, baselines blessed on one failed on the other on every glyph edge. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Same FONTS, not just the same rasterisation. Text with no app font set falls back to
       a system family, and the two machines resolve those differently: the dev image's
       sans-serif/system-ui is Inter (CI has no Inter), CI's is DejaVu. Hide Inter and pin the
       generic families to Liberation Sans, which both install (CI via playwright's
       with-deps). Measured on 2026-10-11: with only hinting pinned, 13/25 screens still
       differed on CI, every one of them in fallback-font text. -->
  <selectfont>
    <rejectfont>
      <glob>*/Inter*</glob>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
